<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>web2ai</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="panel">
      <header class="panel__header">
        <h1 class="panel__title">web2ai</h1>
        <span class="panel__version" id="panel-version"></span>
      </header>

      <section class="card" aria-labelledby="scene-heading">
        <h2 class="card__title" id="scene-heading">Scene</h2>
        <p class="card__lead" id="scene-status">No scene loaded.</p>
        <dl class="kv" id="scene-info"></dl>
        <details class="report" id="scene-report" hidden>
          <summary class="report__summary" id="scene-report-summary">Report</summary>
          <table class="report__table">
            <tbody id="scene-report-rows"></tbody>
          </table>
        </details>
        <div class="actions">
          <button class="btn btn--primary" id="open-scene" type="button">Open scene file...</button>
        </div>
      </section>

      <section class="card" aria-labelledby="import-heading">
        <h2 class="card__title" id="import-heading">Import</h2>
        <p class="card__lead" id="import-status">Open a scene first.</p>
        <div class="progress" id="progress" hidden>
          <div class="progress__bar" id="progress-bar"></div>
        </div>
        <dl class="kv" id="import-info"></dl>
        <details class="report" id="import-report" hidden>
          <summary class="report__summary" id="import-report-summary">Report</summary>
          <table class="report__table">
            <tbody id="import-report-rows"></tbody>
          </table>
        </details>
        <div class="actions">
          <button class="btn btn--primary" id="import-scene" type="button" disabled>
            Build document
          </button>
          <button class="btn" id="cancel-import" type="button" hidden>Cancel</button>
          <button class="btn" id="export-report" type="button" hidden>Export report</button>
        </div>
      </section>

      <section class="card" aria-labelledby="host-heading">
        <h2 class="card__title" id="host-heading">Host</h2>
        <p class="card__lead" id="host-greeting">Connecting to Illustrator...</p>
        <dl class="kv" id="host-info"></dl>
      </section>

      <section class="card" aria-labelledby="transport-heading">
        <h2 class="card__title" id="transport-heading">Transport</h2>
        <p class="card__lead" id="transport-status">
          Not started -- the local receiver arrives in milestone 2. Until then, capture a page with
          the Chrome extension and open the downloaded .web2ai.json above.
        </p>
      </section>

      <footer class="panel__footer">
        <button class="btn" id="refresh" type="button">Refresh</button>
      </footer>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
